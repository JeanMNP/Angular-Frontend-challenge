<h2>{{ user ? 'Editar Usuário' : 'Novo Usuário' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="nome" />
    <mat-error *ngIf="form.get('nome')?.hasError('required')">
      Nome é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" />
    <mat-error *ngIf="form.get('email')?.hasError('required')">
      Email é obrigatório
    </mat-error>
    <mat-error *ngIf="form.get('email')?.hasError('email')">
      Formato de email inválido
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>CPF</mat-label>
    <input matInput formControlName="cpf" />
    <mat-error *ngIf="form.get('cpf')?.hasError('required')">
      CPF é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Telefone</mat-label>
    <input matInput formControlName="telefone" />
    <mat-error *ngIf="form.get('telefone')?.hasError('required')">
      Telefone é obrigatório
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Tipo de Telefone</mat-label>
    <mat-select formControlName="tipoTelefone">
      <mat-option value="celular">Celular</mat-option>
      <mat-option value="fixo">Fixo</mat-option>
      <mat-option value="comercial">Comercial</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('tipoTelefone')?.hasError('required')">
      Tipo de telefone é obrigatório
    </mat-error>
  </mat-form-field>

  <div class="actions">
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      Salvar
    </button>
    <button mat-button type="button" (click)="form.reset()">Cancelar</button>
  </div>
</form>
